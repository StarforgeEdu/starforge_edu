      description: Public endpoint — no authentication required.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
      - name: ordering
        in: query
        schema:
          type: string
        description: Field to sort by; prefix with `-` for descending.
      - name: search
        in: query
        schema:
          type: string
