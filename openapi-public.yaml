components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      description: 'Opaque session key from `POST /api/v1/auth/role-login/`, sent
        as `Authorization: Bearer <key>`. The tenant is resolved from the request
        Host.'
    cookieSession:
      type: apiKey
      in: cookie
      name: __Host-starforge_session
      description: Secure HttpOnly browser session cookie. Obtain a CSRF token from
        `GET /api/v1/auth/session/` before cookie login or an unsafe request.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Required with cookie authentication on unsafe HTTP methods.
    branchAgentAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Branch print-daemon credential, sent exactly as `Authorization:
        Agent <64-lowercase-hex-token>`. It is tenant- and branch-bound, is returned
        only once at registration, and is not a staff/user session.'
  schemas:
    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Endpoint-specific payload (object or array).
        pagination:
          $ref: '#/components/schemas/Pagination'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeWarning'
          description: Present only when a soft dependency is degraded (fault isolation).
      required:
      - success
    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          description: Stable, machine-branchable error code.
          example: validation_error
        message:
          type: string
          description: Human-readable (localized) detail.
        errors:
          type: object
          description: Optional per-field validation errors.
        request_id:
          type: string
          description: Correlation identifier when one was assigned to the request.
      required:
      - success
      - code
      - message
    SubscriptionRequiredError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum:
          - false
        code:
          type: string
          enum:
          - subscription_required
        message:
          type: string
      required:
      - success
      - code
      - message
    TemporarilyUnavailableError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum:
          - false
        code:
          type: string
          enum:
          - center_inactive
          - service_unavailable
          - temporarily_unavailable
        message:
          type: string
      required:
      - success
      - code
      - message
    RuntimeWarning:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - information_delayed
        message:
          type: string
        affected_sections:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
      required:
      - code
      - message
      - affected_sections
    FieldErrors:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    RoleLoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        device_id:
          type: string
          maxLength: 128
          description: Stable client-generated device identifier; optional.
        platform:
          type: string
          maxLength: 32
          description: Optional client platform label; persisted device values are
            bounded to 16 characters.
      required:
      - username
      - password
    RoleLoginData:
      type: object
      properties:
        access:
          type: string
          minLength: 1
          description: 'Opaque bearer credential. Present for bearer transport; omitted
            when `X-Session-Transport: cookie` stores it in an HttpOnly cookie.'
        role:
          type: string
          enum:
          - student
          - teacher
          - parent
          - staff
          description: Technical role-native principal kind, not a management product
            role.
        must_change_password:
          type: boolean
      required:
      - role
      - must_change_password
    RoleLoginResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          $ref: '#/components/schemas/RoleLoginData'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeWarning'
          description: Present when an optional dependency is degraded.
      required:
      - success
      - data
    SessionBootstrapResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          type: object
          properties:
            csrf_token:
              type: string
              minLength: 1
          required:
          - csrf_token
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeWarning'
          description: Present when an optional dependency is degraded.
      required:
      - success
      - data
    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        message:
          type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeWarning'
          description: Present when an optional dependency is degraded.
      required:
      - success
      - message
    PasswordChangeRequest:
      type: object
      properties:
        old_password:
          type: string
          format: password
          maxLength: 1024
        new_password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          description: Raw, untrimmed value evaluated by all configured password validators.
      required:
      - old_password
      - new_password
    PasswordChangeData:
      type: object
      properties:
        access:
          type: string
          minLength: 1
          description: Replacement bearer credential; omitted for cookie transport.
    PasswordChangeResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        data:
          $ref: '#/components/schemas/PasswordChangeData'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeWarning'
          description: Present when an optional dependency is degraded.
      required:
      - success
      - data
    WrongPasswordError:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        code:
          type: string
          enum:
          - wrong_password
        message:
          type: string
        errors:
          type: object
          properties:
            old_password:
              type: array
              items:
                type: string
          required:
          - old_password
      required:
      - success
      - code
      - message
      - errors
    WeakPasswordError:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        code:
          type: string
          enum:
          - weak_password
        message:
          type: string
        errors:
          type: object
          properties:
            new_password:
              type: array
              items:
                type: string
          required:
          - new_password
      required:
      - success
      - code
      - message
      - errors
    ScopeLabel:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
      required:
      - id
      - name
    RoleMembership:
      type: object
      properties:
        id:
          type: integer
        account_type:
          type: integer
          nullable: true
        account_type_slug:
          type: string
        account_type_name:
          type: string
        account_kind:
          type: string
        legacy_role:
          type: string
        branch:
          type: integer
          nullable: true
        branch_name:
          type: string
          nullable: true
        department:
          type: integer
          nullable: true
        department_name:
          type: string
          nullable: true
        granted_at:
          type: string
          format: date-time
      required:
      - id
      - account_type
      - branch
      - branch_name
      - department
      - department_name
    PermissionScope:
      type: object
      properties:
        branch:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ScopeLabel'
        department:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ScopeLabel'
        effective_permissions:
          type: array
          items:
            type: string
      required:
      - branch
      - department
      - effective_permissions
    UserBootstrapData:
      type: object
      additionalProperties: false
      description: Current role-native identity plus the effective authorization context.
        Clients admit management roles from active memberships, never from `principal_kind`
        alone.
      properties:
        id:
          type: integer
        principal_kind:
          type: string
          enum:
          - student
          - teacher
          - parent
          - staff
        username:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        full_name:
          type: string
        birthdate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
          - ''
          - m
          - f
        preferred_language:
          type: string
          enum:
          - uz
          - ru
          - en
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        student_id:
          type: string
        status:
          type: string
        branch:
          type: integer
          nullable: true
        current_cohort:
          type: integer
          nullable: true
        department:
          type: integer
          nullable: true
        role_memberships:
          type: array
          items:
            $ref: '#/components/schemas/RoleMembership'
        effective_permissions:
          type: array
          items:
            type: string
          uniqueItems: true
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/PermissionScope'
        organization_locale:
          type: string
        organization_timezone:
          type: string
          example: Asia/Tashkent
          description: Authoritative organization-wide IANA timezone.
        primary_currency:
          type: string
          minLength: 3
          maxLength: 3
          example: UZS
        read_only_session:
          type: boolean
