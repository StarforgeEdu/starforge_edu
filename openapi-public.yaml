        branch, cohort, status, and agent are server-owned and rejected if supplied.
      properties:
        source:
          type: string
          enum:
          - assignment
          - transcript
          - report
          - receipt
          - content
          - upload
        source_id:
          type: integer
          format: int64
          minimum: 1
          description: Assignment, Transcript, ReportRun, Payment, LessonFile, or
            print upload grant ID.
        attachment_index:
          type: integer
          minimum: 0
          description: Required only when an assignment has multiple attachments;
            zero-based.
        pages:
          type: integer
          minimum: 1
          description: Optional consistency hint for content/upload; the server derives
            the authoritative PDF/image count and rejects a mismatch. Required for
            legacy sources.
        copies:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        color:
          type: boolean
          default: false
        duplex:
          type: boolean
          default: false
        printer:
          type: integer
          format: int64
          minimum: 1
          description: Active in-scope printer; required for content and upload sources.
        scheduled_for:
          type: string
          format: date-time
          nullable: true
          description: Timezone-aware start time within 365 days; null/omitted means
            now.
      required:
      - source
      - source_id
