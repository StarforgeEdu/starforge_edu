openapi: 3.0.3
info:
  title: Starforge Edu API
  version: 1.0.0
  description: 'Multi-tenant education-center platform API. Every response uses one
    envelope: success `{success:true, data, pagination?}`, error `{success:false,
    code, message, errors?}`. Authentication uses an opaque session key through Bearer
    or a Secure HttpOnly cookie; cookie-authenticated unsafe methods also require
    the CSRF header. The tenant is selected by the request Host (a center subdomain);
    a mobile app resolves it first via `GET /api/v1/platform/resolve/?slug=<center>`.
    See `agents/API-CONTRACT.md` for the full narrative and field-level detail.'
paths:
  /api/v1/auth/login/:
    post:
      operationId: post_auth_platform_login
      summary: POST platform login
      tags:
      - auth
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          description: Validation / bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The tenant or requested capability is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporarilyUnavailableError'
      description: Public endpoint — no authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
  /api/v1/auth/logout/:
    post:
      operationId: post_auth_logout
      summary: Sign out the current session
      tags:
      - auth
      responses:
        '200':
          description: The current session is signed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '403':
          description: Cookie CSRF validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The tenant or requested capability is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporarilyUnavailableError'
      security:
      - {}
      - sessionAuth: []
      - cookieSession: []
        csrfHeader: []
      description: Idempotently revokes only the credential used by this request.
        Missing, expired, malformed, or previously revoked credentials are already
        signed out and still succeed.
  /api/v1/auth/password/change/:
    post:
      operationId: post_auth_password_change
      summary: Change the current principal password
      tags:
      - auth
      responses:
        '200':
          description: Password changed and replacement session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeResponse'
        '400':
          description: Current password is wrong, new password is weak, or JSON is
            malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeError'
        '401':
          description: Session is absent, invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cookie CSRF validation failed or the session is read-only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Request rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The tenant or requested capability is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporarilyUnavailableError'
      security:
      - sessionAuth: []
      - cookieSession: []
        csrfHeader: []
      description: Validates the raw new password with every configured Django password
        validator, clears mandatory-password state, revokes prior sessions, and issues
        one replacement credential for the current device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
